# Backend service
backend:
  build: .
  ports:
    - "${PORT}:${PORT}"
  environment:
    GIN_MODE: ${GIN_MODE}
    DB_HOST: ${DB_HOST}
    DB_PORT: 5432
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    DB_SSLMODE: ${DB_SSLMODE}
    JWT_SECRET: ${JWT_SECRET}
    IS_SECURE: ${IS_SECURE}
  # Now checks if GIN_MODE equals "debug"
  command:
    sh -c 'if [ "$GIN_MODE" = "debug" ]; then echo "Debug mode: Generating Swagger..."; go generate ./...; fi; exec go run cmd/server/main.go'
  depends_on:
    postgres:
      condition: service_healthy
