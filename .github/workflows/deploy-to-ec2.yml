name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    environment: back-env

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env for Docker Compose
        env:
          BUILD_TARGET: ${{ secrets.BUILD_TARGET }}
          GIN_MODE: ${{ secrets.GIN_MODE }}
          PORT: ${{ secrets.PORT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IS_SECURE: ${{ secrets.IS_SECURE }}
        run: |
          echo "BUILD_TARGET=$BUILD_TARGET" > .env
          echo "GIN_MODE=$GIN_MODE" >> .env
          echo "PORT=$PORT" >> .env
          echo "DB_HOST=$DB_HOST" >> .env
          echo "DB_PORT=$DB_PORT" >> .env
          echo "DB_USER=$DB_USER" >> .env
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "DB_NAME=$DB_NAME" >> .env
          echo "DB_SSLMODE=$DB_SSLMODE" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "IS_SECURE=$IS_SECURE" >> .env

      - name: Start Docker Compose
        run: docker compose up --build -d

      # Moved after the build so Docker reuses your Go module and build caches
      - name: Cleanup Unused Docker Resources
        run: docker image prune -f
